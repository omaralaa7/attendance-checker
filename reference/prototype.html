<title>دفتر الغياب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* Layout: one narrow RTL column — upload panel on top, roster ledger below, sticky save bar */
:root{
  --bg:#f3f5f9; --paper:#ffffff; --ink:#1b2440; --muted:#5c6684; --line:#dfe4ee;
  --pen:#2340a8; --pen-soft:#e6ebfa;
  --ok:#1e7a46; --ok-soft:#e2f4ea; --no:#b3261e; --no-soft:#fbe6e4; --warn:#9a6b00; --warn-soft:#fdf3d6;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141c; --paper:#1a1f2b; --ink:#e7ebf5; --muted:#9aa3bb; --line:#2c3346;
  --pen:#8ea6ff; --pen-soft:#232c4a; --ok:#5fd18f; --ok-soft:#173326; --no:#ff8a80; --no-soft:#3a1d1b; --warn:#f2c14e; --warn-soft:#3a3016; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141c; --paper:#1a1f2b; --ink:#e7ebf5; --muted:#9aa3bb; --line:#2c3346;
  --pen:#8ea6ff; --pen-soft:#232c4a; --ok:#5fd18f; --ok-soft:#173326; --no:#ff8a80; --no-soft:#3a1d1b; --warn:#f2c14e; --warn-soft:#3a3016; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:18px}
header h1{font-family:var(--f-display);font-size:30px;margin:0;color:var(--pen);text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.panel h2{font-family:var(--f-display);font-size:18px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.field{display:grid;gap:4px;flex:1 1 200px;min-width:0}
label.lbl{font-size:13px;color:var(--muted);font-weight:500}
input[type=date]{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--pen);background:var(--pen-soft);color:var(--ink)}
.drop input{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:72px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
button.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--pen);color:var(--paper)}
button.btn.ghost{background:transparent;color:var(--pen);border:1px solid var(--pen)}
button.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,.drop:focus-within,input:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.status{font-size:14px;color:var(--muted);min-height:1.4em}
.status.err{color:var(--no)}
.meta{font-size:13px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;border-radius:999px;padding:5px 14px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip b{font-weight:600}
.list{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
.st{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.st .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.st .nm{min-width:0}
.st .nm small{display:block;color:var(--muted);font-size:12px}
.st.flag{background:var(--warn-soft)}
.mark{width:46px;height:40px;border-radius:10px;border:0;font-size:22px;font-weight:700;cursor:pointer}
.mark.p{background:var(--ok-soft);color:var(--ok)}
.mark.a{background:var(--no-soft);color:var(--no)}
.extra{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.bar{position:fixed;inset:auto 0 0 0;background:var(--paper);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .sum{flex:1 1 160px;font-variant-numeric:tabular-nums;font-size:14px}
.sum .ok{color:var(--ok);font-weight:600}.sum .no{color:var(--no);font-weight:600}
details summary{cursor:pointer;color:var(--pen);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>دفتر الغياب</h1>
    <p>صوّر ورقة الحضور المكتوبة بخط اليد، وهتتعلم الأسماء في ملف الإكسل: ✓ للحاضر و ✗ للغايب.</p>
  </header>

  <section class="panel" aria-labelledby="h-take">
    <h2 id="h-take">تسجيل محاضرة</h2>
    <div class="row">
      <div class="field">
        <label class="lbl" for="date">تاريخ المحاضرة</label>
        <input type="date" id="date">
      </div>
    </div>
    <label class="drop" id="drop">
      <input type="file" id="photos" accept="image/*" multiple>
      <strong>اضغط هنا وارفع صور ورق الحضور</strong><br>
      <span class="meta">ممكن أكتر من صورة (مثلاً ورقة لكل شعبة)</span>
    </label>
    <div class="thumbs" id="thumbs"></div>
    <div class="row">
      <button class="btn" id="read">اقرأ الأسماء وعلّم الغياب</button>
      <button class="btn ghost" id="stop" hidden>إيقاف</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </section>

  <section class="panel" aria-labelledby="h-sheet">
    <h2 id="h-sheet">ملف الطلبة</h2>
    <div class="meta" id="sheetInfo"></div>
    <details>
      <summary>تغيير ملف الإكسل</summary>
      <p class="meta">ارفع كشف الطلبة من نظام ابن الهيثم (أو أي ملف فيه عمود "اسم الطالب").</p>
      <input type="file" id="xlsx" accept=".xlsx">
    </details>
  </section>

  <section aria-labelledby="h-list" style="display:grid;gap:10px">
    <div class="row" style="justify-content:space-between">
      <h2 id="h-list" style="font-family:var(--f-display);font-size:18px;margin:0">الكشف — <span id="curDate"></span></h2>
    </div>
    <div class="stats" id="filters"></div>
    <div class="extra" id="extra" hidden></div>
    <div class="list" id="list"></div>
    <p class="meta">اضغط على العلامة لو عايز تغيّرها. السطور الصفرا محتاجة مراجعة منك.</p>
  </section>
</div>

<div class="bar"><div class="in">
  <div class="sum" id="sum"></div>
  <button class="btn" id="save">حفظ ملف الإكسل</button>
</div></div>

<script>
const SEED_B64="__B64__";
const $=id=>document.getElementById(id);
let wbBuf=null, ws=null, wb=null, students=[], headerRow=7, nameCol=3, numCol=1, dateCols={};
let marks={}, flags={}, notes={}, extraNames=[], curKey="", photos=[], filter="all", ctl=null;
const clean=v=>{if(v==null)return"";if(typeof v==="object"){if(v.richText)return v.richText.map(t=>t.text).join("");if(v.text)return String(v.text);if(v.result!=null)return String(v.result);}return String(v).replace(/ /g," ").trim();};
const fmt=d=>{const [y,m,dd]=d.split("-");return `${+dd}/${+m}/${y}`;};
const toIso=s=>{const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:null;};

function b64ToBuf(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function bufToB64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

async function openWorkbook(buf){
  wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf.slice(0)); wbBuf=buf;
  ws=wb.worksheets[0]; students=[]; dateCols={};
  headerRow=0;
  ws.eachRow((row,r)=>{ if(headerRow) return;
    row.eachCell((c,ci)=>{const t=clean(c.value); if(t.includes("اسم الطالب")||t==="الاسم"){headerRow=r;nameCol=ci;} });
  });
  if(!headerRow) throw new Error("مش لاقي عمود \"اسم الطالب\" في الملف.");
  const hdr=ws.getRow(headerRow);
  numCol=1; hdr.eachCell((c,ci)=>{const t=clean(c.value); if(t==="م")numCol=ci;
    const iso=toIso(t)||(c.value instanceof Date?c.value.toISOString().slice(0,10):null); if(iso) dateCols[iso]=ci;});
  for(let r=headerRow+1;r<=ws.rowCount;r++){
    const nm=clean(ws.getRow(r).getCell(nameCol).value); if(!nm) continue;
    students.push({r, n:clean(ws.getRow(r).getCell(numCol).value)||String(students.length+1), name:nm});
  }
  const t=clean(ws.getCell("B2").value);
  $("sheetInfo").textContent=`${t?t+" — ":""}${students.length} طالب • محاضرات متسجلة: ${Object.keys(dateCols).length? Object.keys(dateCols).sort().map(fmt).join("، "):"لا يوجد"}`;
}

function loadSession(iso){
  curKey=iso; marks={}; flags={}; notes={}; extraNames=[];
  $("curDate").textContent=fmt(iso);
  const ci=dateCols[iso];
  students.forEach(s=>{ const v=ci?clean(ws.getRow(s.r).getCell(ci).value):"";
    marks[s.r]= v==="✓"?"p":v==="✗"?"a":null;
    const fill=ci&&ws.getRow(s.r).getCell(ci).fill; if(fill&&fill.fgColor&&/FFEB9C/i.test(fill.fgColor.argb||"")) flags[s.r]=true; });
  render();
}

function render(){
  const P=students.filter(s=>marks[s.r]==="p").length, A=students.filter(s=>marks[s.r]==="a").length,
        F=students.filter(s=>flags[s.r]).length, U=students.length-P-A;
  const f=[["all","الكل",students.length],["p","حاضر",P],["a","غايب",A],["f","للمراجعة",F]];
  $("filters").innerHTML=f.map(([k,l,c])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l} <b>${c}</b></button>`).join("");
  $("sum").innerHTML = (P+A)? `<span class="ok">✓ ${P} حاضر</span> · <span class="no">✗ ${A} غايب</span>${U?` · ${U} بدون علامة`:""}` : `لسه مفيش علامات لتاريخ ${fmt(curKey)}`;
  const rows=students.filter(s=>filter==="all"||(filter==="f"?flags[s.r]:marks[s.r]===filter));
  $("list").innerHTML=rows.map(s=>{const m=marks[s.r];
    return `<div class="st${flags[s.r]?" flag":""}"><span class="n">${s.n}</span><span class="nm">${esc(s.name)}${notes[s.r]?`<small>${esc(notes[s.r])}</small>`:""}</span>
    <button class="mark ${m||""}" data-r="${s.r}" aria-label="${m==="p"?"حاضر":m==="a"?"غايب":"بدون علامة"} — اضغط للتغيير">${m==="p"?"✓":m==="a"?"✗":"–"}</button></div>`}).join("")||`<div class="st"><span></span><span class="meta">مفيش أسماء هنا.</span><span></span></div>`;
  $("extra").hidden=!extraNames.length;
  if(extraNames.length) $("extra").innerHTML=`<strong>أسماء مكتوبة في الورقة ومش لاقيها في الكشف:</strong> ${extraNames.map(esc).join("، ")}`;
  $("save").disabled=!(P+A);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

$("filters").onclick=e=>{const b=e.target.closest("[data-f]"); if(!b)return; filter=b.dataset.f; render();};
$("list").onclick=e=>{const b=e.target.closest("[data-r]"); if(!b)return; const r=+b.dataset.r;
  marks[r]=marks[r]==="p"?"a":"p"; delete flags[r]; render();};
$("date").onchange=()=>{ if($("date").value) loadSession($("date").value); };

// photos
function addPhotos(files){ for(const f of files){ if(!f.type.startsWith("image/"))continue; photos.push({f,url:URL.createObjectURL(f)}); } drawThumbs(); }
function drawThumbs(){ $("thumbs").innerHTML=photos.map((p,i)=>`<div class="thumb"><img src="${p.url}" alt="صورة ${i+1}"><button data-i="${i}" aria-label="شيل الصورة">×</button></div>`).join(""); }
$("photos").onchange=e=>{addPhotos(e.target.files); e.target.value="";};
$("thumbs").onclick=e=>{const b=e.target.closest("[data-i]"); if(!b)return; photos.splice(+b.dataset.i,1); drawThumbs();};
const drop=$("drop");
["dragover","dragenter"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>addPhotos(e.dataTransfer.files));

// split a tall page into overlapping halves so the handwriting stays sharp after downsizing
async function slices(file,parts){
  const bmp=await createImageBitmap(file); const out=[]; const h=bmp.height, step=h/parts, ov=h*0.06;
  for(let i=0;i<parts;i++){ const y0=Math.max(0,i*step-ov), y1=Math.min(h,(i+1)*step+ov);
    const c=document.createElement("canvas"); c.width=bmp.width; c.height=Math.round(y1-y0);
    c.getContext("2d").drawImage(bmp,0,y0,bmp.width,y1-y0,0,0,bmp.width,y1-y0);
    out.push(await new Promise(res=>c.toBlob(res,"image/jpeg",0.92))); }
  return out;
}

function setStatus(t,err){ $("status").textContent=t; $("status").classList.toggle("err",!!err); }

$("read").onclick=async()=>{
  if(!photos.length){ setStatus("ارفع صورة ورقة الحضور الأول.",true); return; }
  if(!$("date").value){ setStatus("اختار تاريخ المحاضرة.",true); return; }
  const sample=await claude.use("sample");
  if(!sample){ setStatus("قراءة الصور مش متاحة هنا. افتح الصفحة من Claude وانت مسجل دخول.",true); return; }
  const lim=await sample.limits().catch(()=>null); const max=lim?.images?.maxCount||1;
  if(!lim?.images){ setStatus("إرسال الصور مش متاح في العرض ده.",true); return; }
  let imgs=[]; const parts=photos.length*2<=max?2:1;
  if(photos.length>max){ setStatus(`أقصى عدد صور في المرة ${max}.`,true); return; }
  for(const p of photos){ const s=await slices(p.f,parts); imgs.push(...s); }
  const roster=students.map(s=>`${s.r}|${s.name}`).join("\n");
  const prompt=`أنت بتقرأ ورق حضور محاضرة في كلية هندسة مصرية، مكتوب بخط اليد بالعربي. الطلبة كتبوا أساميهم بنفسهم في الورقة.
الصور المرفقة (${imgs.length} صورة) هي ${photos.length} ورقة${parts===2?"، كل ورقة متقسمة لنصين فوق وتحت بتداخل بسيط، فممكن نفس الاسم يظهر في صورتين — احسبه مرة واحدة":""}.
اقرأ كل اسم مكتوب، وطابقه مع كشف الطلبة الرسمي ده (الصيغة: رقم_الصف|الاسم الكامل). الاسم المكتوب غالباً أقصر (اسم الطالب + الأب + الجد أو اللقب)، والإملاء ممكن يختلف (ه/ة، ى/ي، أ/ا، عبد الله/عبدالله).
لو اسم متشطب أو ممسوح أو باهت جداً اعتبره "مشكوك" (doubt=true).
الكشف:
${roster}

رد بـ JSON فقط بالشكل ده بدون أي كلام تاني:
{"present":[{"row":رقم_الصف,"written":"الاسم كما هو مكتوب","doubt":false}],"unmatched":["اسم مكتوب مش لاقي له مقابل"]}
متكررش نفس row. لو مش متأكد من المطابقة بين طالبين حط doubt=true.`;
  $("read").disabled=true; $("stop").hidden=false; ctl=new AbortController();
  setStatus("بيقرأ الأسماء من الصور… ده ممكن ياخد دقيقة.");
  try{
    const {text}=await sample(prompt,{images:imgs,modelTier:"complex",signal:ctl.signal,
      onText:()=>setStatus("بيطابق الأسماء مع الكشف…")});
    const j=JSON.parse(text.slice(text.indexOf("{"),text.lastIndexOf("}")+1));
    const valid=new Set(students.map(s=>s.r));
    curKey=$("date").value; $("curDate").textContent=fmt(curKey);
    marks={}; flags={}; notes={}; students.forEach(s=>marks[s.r]="a");
    let n=0; for(const p of j.present||[]){ const r=+p.row; if(!valid.has(r))continue;
      if(p.doubt){ marks[r]="a"; flags[r]=true; notes[r]=`مكتوب: ${p.written||""} (باهت/متشطب أو مش واضح)`; }
      else { marks[r]="p"; n++; if(p.written) notes[r]=""; } }
    extraNames=(j.unmatched||[]).filter(Boolean);
    filter="all"; render();
    setStatus(`اتقرأ ${n} اسم حاضر. راجع السطور الصفرا وبعدين احفظ الملف.`);
  }catch(e){
    if(e?.code==="cancelled") setStatus("اتلغى.");
    else if(e?.code==="not_granted") setStatus("لازم توافق إن الصفحة تستخدم Claude علشان تقرأ الصور.",true);
    else if(e?.code==="rate_limited") setStatus("طلبات كتير ورا بعض. استنى شوية وجرب تاني.",true);
    else if(e instanceof SyntaxError) setStatus("الرد مكانش مفهوم. جرب تاني أو صوّر الورقة أوضح.",true);
    else setStatus("حصلت مشكلة في قراءة الصور: "+(e?.message||e),true);
  }finally{ $("read").disabled=false; $("stop").hidden=true; }
};
$("stop").onclick=()=>ctl?.abort();

// write the column into the workbook and offer the file
$("save").onclick=async()=>{
  const hdr=ws.getRow(headerRow); let ci=dateCols[curKey];
  if(!ci){ let max=0; hdr.eachCell((c,i)=>{max=Math.max(max,i)}); ci=max+1; dateCols[curKey]=ci; }
  const ref=hdr.getCell(Math.max(1,ci-1)); const hc=hdr.getCell(ci);
  hc.value=fmt(curKey); hc.style=JSON.parse(JSON.stringify(ref.style||{})); hc.alignment={horizontal:"center"};
  ws.getColumn(ci).width=14;
  for(const s of students){ const c=ws.getRow(s.r).getCell(ci); const m=marks[s.r];
    const ref2=ws.getRow(s.r).getCell(nameCol);
    c.value= m==="p"?"✓":m==="a"?"✗":null;
    c.border=ref2.border; c.alignment={horizontal:"center",vertical:"middle"};
    c.font={bold:true,size:14,color:{argb: m==="p"?"FF006100":"FF9C0006"}};
    c.fill={type:"pattern",pattern:"solid",fgColor:{argb: flags[s.r]?"FFFFEB9C": m==="p"?"FFC6EFCE":"FFFFC7CE"}};
  }
  const buf=await wb.xlsx.writeBuffer();
  wbBuf=buf; store("ghiab_wb",bufToB64(buf));
  await openWorkbook(buf);
  const name=`الغياب ${fmt(curKey).replace(/\//g,"-")}.xlsx`;
  const dl=await claude.use("downloads");
  if(!dl){ setStatus("حفظ الملفات مش متاح في العرض ده، بس العلامات اتسجلت في الصفحة.",true); return; }
  try{ await dl.save({filename:name,data:new Blob([buf])}); setStatus("اتحفظ الملف. كل محاضرة بتتضاف كعمود جديد في نفس الملف."); }
  catch(e){ if(e?.code!=="declined") setStatus("الملف ماتحفظش: "+(e?.message||e?.code),true); }
};

$("xlsx").onchange=async e=>{ const f=e.target.files[0]; if(!f)return;
  try{ const b=await f.arrayBuffer(); await openWorkbook(b); store("ghiab_wb",bufToB64(b)); loadSession($("date").value||curKey); setStatus("اتحمل ملف الطلبة الجديد."); }
  catch(err){ setStatus(err.message||"الملف ده مش مقروء.",true); } };

(async()=>{
